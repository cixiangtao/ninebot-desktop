name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm check
      - name: Build application
        run: pnpm build

  package-windows:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Windows x64 package
        run: pnpm package:win:local
      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninebot-desktop-windows-pr-${{ github.event.pull_request.number }}
          path: |
            release/ninebot-desktop-*-win-x64.exe
            release/ninebot-desktop-*-win-x64.zip
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 3
