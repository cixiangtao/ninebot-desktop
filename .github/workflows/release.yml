name: Release desktop prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
      - name: Expose uvx at its standard user path
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          ln -sf "$(command -v uvx)" "${HOME}/.local/bin/uvx"
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Validate release ref
        shell: bash
        run: ./scripts/validate-release-ref.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm check
      - name: Build and verify Apple Silicon package
        run: pnpm package:mac:local
      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninebot-desktop-macos-${{ github.ref_name }}
          path: |
            release/ninebot-desktop-*-mac-arm64.dmg
            release/ninebot-desktop-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Validate release ref
        shell: bash
        run: ./scripts/validate-release-ref.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm check
      - name: Build and verify Windows x64 package
        run: pnpm package:win:local
      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ninebot-desktop-windows-${{ github.ref_name }}
          path: |
            release/ninebot-desktop-*-win-x64.exe
            release/ninebot-desktop-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release ref
        shell: bash
        run: ./scripts/validate-release-ref.sh
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ninebot-desktop-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Create combined checksum manifest
        shell: bash
        run: |
          cd release-assets
          expected=(
            "ninebot-desktop-${GITHUB_REF_NAME#v}-mac-arm64.dmg"
            "ninebot-desktop-${GITHUB_REF_NAME#v}-mac-arm64.zip"
            "ninebot-desktop-${GITHUB_REF_NAME#v}-win-x64.exe"
            "ninebot-desktop-${GITHUB_REF_NAME#v}-win-x64.zip"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "Missing release asset: ${asset}" >&2
              exit 1
            fi
          done
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          assets=(release-assets/*)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "韭号出行 ${GITHUB_REF_NAME}" \
              --notes-file "${notes}" \
              --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --title "韭号出行 ${GITHUB_REF_NAME}" \
              --notes-file "${notes}" \
              --prerelease
          fi
      - name: Verify release metadata
        shell: bash
        run: |
          release_json="$(gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease,assets,url)"
          RELEASE_JSON="${release_json}" node --input-type=module <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          const version = release.tagName.slice(1);
          const expectedAssets = new Set([
            `ninebot-desktop-${version}-mac-arm64.dmg`,
            `ninebot-desktop-${version}-mac-arm64.zip`,
            `ninebot-desktop-${version}-win-x64.exe`,
            `ninebot-desktop-${version}-win-x64.zip`,
            "SHA256SUMS.txt",
          ]);
          if (release.isDraft || !release.isPrerelease) throw new Error("Unexpected release state");
          for (const asset of release.assets) expectedAssets.delete(asset.name);
          if (expectedAssets.size > 0) {
            throw new Error(`Missing release assets: ${[...expectedAssets].join(", ")}`);
          }
          console.log(release.url);
          NODE
